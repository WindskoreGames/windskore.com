<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact us – Windskore</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      color: #333;
    }
    header {
      background: #1a1a1a;
      color: #fff;
      padding: 2rem;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 2rem; }
    .container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 2rem;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 { margin-top: 0; color: #1a1a1a; }
    .contact-info { margin-bottom: 2rem; }
    .contact-info p { margin: 0.5rem 0; }
    form { display: flex; flex-direction: column; }
    label { margin: 0.5rem 0 0.2rem; font-weight: bold; }
    input, textarea {
      padding: 0.8rem;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 1rem;
      width: 100%;
    }
    textarea { min-height: 120px; resize: vertical; }
    button {
      margin-top: 1rem;
      padding: 1rem;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    button:hover { background: #0c5fd1; }
    @media (max-width: 600px) {
      .container { padding: 1rem; }
    }
    .message { margin-top: 1rem; font-weight: bold; }
  </style>
</head>
<body>
  <header>
    <h1>Contact Windskore</h1>
    <p>We look forward to hearing from you!</p>
  </header>

  <div class="container">
    <section class="contact-info">
      <h2>Contact information</h2>
      <p>📧 Email: <a href="mailto:support@windskore.com">support@windskore.com</a></p>
      <p>📍 Address: Hedemora, Sweden</p>
      <p>📞 Phone: +46 (0)70-123 45 67</p>
    </section>

    <section class="contact-form">
      <h2>Send a message</h2>
      <form id="contactForm">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" required></textarea>

        <button type="submit">Send</button>
      </form>
      <div class="message" id="formMessage"></div>
    </section>
  </div>

  <script>
    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('formMessage').textContent = 'Thank you! Your message has been sent.';
      this.reset();
    });
  </script>
</body>
</html>
